    <!-- Contact Section -->
    <div class="contact-container">
        <div class="contact-title">
            <h2>Contact Me</h2>
            <p>If you'd like to get in touch, feel free to fill out the form below.</p>
        </div>

        <!-- Left & Right Split -->
        <div class="contact-row">

            <!-- Left Side (Info + Map) -->
            <div class="contact-left">
                <div class="info-box">
                    <i class="fa-solid fa-location-dot"></i>
                    <div>
                        <h3>Address</h3>
                        <p>Rasipuram, Namakkal, TN 637505</p>
                    </div>
                </div>

                <div class="info-box">
                    <i class="fa-solid fa-phone"></i>
                    <div>
                        <h3>Phone</h3>
                        <p>+91 9342785446</p>
                    </div>
                </div>

                <div class="info-box">
                    <i class="fa-solid fa-envelope"></i>
                    <div>
                        <h3>Email</h3>
                        <p>monishmm15@gmail.com</p>
                    </div>
                </div>

                <div class="map-box">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31688.08320473375!2d78.0679223!3d11.4966247!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ba8577c0f42e5ef%3A0x132db8ae7f5db24a!2sRasipuram%2C%20Tamil%20Nadu%20637505%2C%20India!5e0!3m2!1sen!2sus!4v1600000000000!5m2!1sen!2sus"
                        width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>

            <!-- Right Side (Form) -->
            <div class="contact-right">
                <form action="#" method="post" class="contact-form">
                    <div class="form-row">
                        <input type="text" id="name" name="name" placeholder="Your Name" required>
                        <input type="email" id="email" name="email" placeholder="Your Email" required>
                    </div>
                    <input type="text" id="subject" name="subject" placeholder="Subject" required>
                    <textarea id="message" name="message" rows="6" placeholder="Message" required></textarea>
                    <button type="submit">Send Message</button>
                </form>
            </div>

        </div>
    </div>
